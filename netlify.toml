# Configuração do Netlify. O Next.js é detectado sozinho;
# aqui só fixamos a versão do Node exigida pelo Next.js 16.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Estas variáveis são públicas por natureza (aparecem nas telas e nos
  # contratos), então a verificação de segredos não deve barrar o build.
  # Chaves secretas de verdade (ex.: SUPABASE_SECRET_KEY) continuam verificadas.
  SECRETS_SCAN_OMIT_KEYS = "AGENCIA_NOME,AGENCIA_CIDADE_FORO,AGENCIA_DOCUMENTO,AGENCIA_ENDERECO,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
